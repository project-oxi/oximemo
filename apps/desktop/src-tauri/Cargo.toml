[package]
name = "oximemo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri 2 desktop app for oximemo"
publish = false

[lib]
name = "oximemo_desktop"
path = "src/lib.rs"

[[bin]]
name = "oximemo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "custom-protocol", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = "0.12"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt"] }

oximemo-core = { workspace = true }
oximemo-capture = { workspace = true }
oxibrain-client = { workspace = true }
