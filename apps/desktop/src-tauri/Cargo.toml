[package]
name = "oxinot-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri 2 desktop app for oxinot"

[lib]
name = "oxinot_desktop"
path = "src/lib.rs"

[[bin]]
name = "oxinot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "custom-protocol"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = "0.12"

oxinot-core = { workspace = true }
oxinot-capture = { workspace = true }
tauri-macros = "2"
