[workspace]
resolver = "2"
members = [
    "crates/oxi-frontmatter",
    "crates/oxi-vault-git",
    "crates/oximemo-core",
    "crates/oximemo-cli",
    "crates/oximemo-capture",
    "crates/oximemo-metadata",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.89"
authors = ["oximemo"]
license = "MIT"
repository = "https://github.com/project-oxi/oximemo"
homepage = "https://github.com/project-oxi/oximemo"

# Centralized dependency versions. Crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# Serialization / formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Domain primitives
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
time = { version = "0.3", features = ["serde", "serde-human-readable", "serde-well-known", "parsing", "formatting", "macros", "local-offset"] }

# Storage
redb = "3"
# Linked ONLY for the one-shot v2→v3 file-format hop (see store/index.rs);
# redb 3 hard-rejects v2 files and 2.6.x is the last line that can upgrade them.
redb2 = { package = "redb", version = "2.6" }
tantivy = "0.22"
notify = "7"
fs2 = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# macOS native
objc2 = "0.5"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSApplication", "NSWindow", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "block2"] }

# Errors
objc2-foundation = { version = "0.3", features = ["NSString", "NSProcessInfo", "NSThread", "NSRunLoop"] }
thiserror = "2"
oxibrain-client = { version = "0.7", git = "https://github.com/a7garden/oxibrain", tag = "v0.7.0" }
anyhow = "1"
oxi-vault-git = "0.1"

oximemo-core = { path = "crates/oximemo-core", version = "0.10.0" }
oximemo-capture = { path = "crates/oximemo-capture", version = "0.10.0" }
oximemo-metadata = { path = "crates/oximemo-metadata", version = "0.10.0" }

[profile.release]
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
