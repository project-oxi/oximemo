name: Release

# Builds the `oximemo` CLI binary and macOS desktop app artifacts for
# aarch64-apple-darwin, then publishes a GitHub Release.
#
# Official releases require Developer ID signing, notarization, and updater
# signing. Forks may still build unsigned artifacts.
#
#   git tag v0.19.0 && git push origin v0.19.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.19.0)'
        required: true

permissions:
  contents: write

env:
  TARGET: aarch64-apple-darwin

jobs:
  build:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          TAURI_VERSION="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          if [[ "$RELEASE_TAG" != "v$VERSION" || "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "::error::tag, Cargo.toml, and tauri.conf.json versions must match (tag=$RELEASE_TAG, cargo=$VERSION, tauri=$TAURI_VERSION)"
            exit 1
          fi
          echo "Validated release tag $RELEASE_TAG at $(git rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The desktop crate's `generate_context!()` embeds build.frontendDist,
      # so the frontend must be built before the Tauri bundle.
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Build CLI binary
        run: cargo build --locked --release -p oximemo-cli --target ${{ env.TARGET }}

      - name: Package CLI binary
        run: |
          mkdir -p staging
          tar -czf staging/oximemo-${{ env.TARGET }}.tar.gz \
            -C target/${{ env.TARGET }}/release oximemo
          shasum -a 256 staging/oximemo-${{ env.TARGET }}.tar.gz \
            | awk '{print $1}' > staging/oximemo-${{ env.TARGET }}.tar.gz.sha256

      # The curl|sh installer ships as a release asset so
      # releases/latest/download/install.sh always matches the binaries
      # it fetches.
      - name: Stage curl installer
        run: cp scripts/install.sh staging/install.sh

      # Stage the CLI binary as a Tauri externalBin sidecar so the .app bundle
      # ships a signed, runnable `oximemo` command (Settings symlinks it onto
      # PATH). Must precede the Tauri build, which embeds + signs it.
      - name: Stage CLI sidecar for app bundle
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ env.TARGET }}/release/oximemo" \
             "apps/desktop/src-tauri/binaries/oximemo-${{ env.TARGET }}"

      # Validate secret availability without writing secret values to
      # GITHUB_ENV or logs. Tauri imports the certificate into a temporary
      # keychain and checks the identity; the resulting app is verified below.
      - name: Ensure secure prompt helper
        run: |
          if ! command -v expect >/dev/null 2>&1; then
            brew install expect
          fi
          command -v expect

      - name: Validate release signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          }
          if [ "$GITHUB_REPOSITORY" = "project-oxi/oximemo" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              require_secret "$name"
            done
          else
            if [ -n "$APPLE_CERTIFICATE" ]; then
              for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                require_secret "$name"
              done
            fi
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "::error::Missing Tauri updater signing password"
              exit 1
            fi
          fi
          echo "Release signing prerequisites validated"
      - name: Build desktop app (.dmg + .app.tar.gz)
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          # Use the exact @tauri-apps/cli pin installed from bun.lock.
          bun run tauri build --target ${{ env.TARGET }} -- --locked

      - name: Verify app signature and notarize DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ "$GITHUB_REPOSITORY" = "project-oxi/oximemo" ]; then
              echo "::error::Official releases require Apple signing"
              exit 1
            fi
            echo "Skipping signature verification for unsigned fork build"
            exit 0
          fi

          BUNDLE="target/${{ env.TARGET }}/release/bundle"
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$APP" ] || [ -z "$DMG_PATH" ]; then
            echo "::error::Tauri app or DMG bundle is missing"
            exit 1
          fi
          export DMG_PATH

          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          AUTHORITY="$(printf '%s\n' "$SIGNATURE" | awk -F= '$1 == "Authority" { print substr($0, index($0, "=") + 1); exit }')"
          TEAM="$(printf '%s\n' "$SIGNATURE" | awk -F= '$1 == "TeamIdentifier" { print $2; exit }')"
          if [ "$AUTHORITY" != "$APPLE_SIGNING_IDENTITY" ] || [ "$TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Built app identity does not match the configured Developer ID"
            exit 1
          fi
          case "$SIGNATURE" in
            *"flags=0x10000(runtime)"*) ;;
            *) echo "::error::App signature lacks hardened runtime"; exit 1 ;;
          esac
          case "$SIGNATURE" in
            *"Timestamp="*) ;;
            *) echo "::error::App signature lacks a secure timestamp"; exit 1 ;;
          esac
          xcrun stapler validate -v "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

          # notarytool prompts securely for the app-specific password when
          # --password is omitted. Expect supplies it through the PTY, never
          # as a process argument or workflow log value.
          expect <<'EXPECT'
          set timeout 120
          log_user 0
          set output ""
          set prompted 0
          spawn -noecho env -u APPLE_PASSWORD xcrun notarytool submit $env(DMG_PATH) --apple-id $env(APPLE_ID) --team-id $env(APPLE_TEAM_ID) --wait --output-format json
          expect {
            -re {(?i)password[^:\r\n]*:} {
              append output $expect_out(buffer)
              send -- "$env(APPLE_PASSWORD)\r"
              set prompted 1
            }
            eof {
              append output $expect_out(buffer)
            }
            timeout {
              puts stderr "::error::Timed out waiting for the secure notarytool password prompt"
              exit 1
            }
          }
          if {$prompted} {
            set timeout -1
            expect eof
            append output $expect_out(buffer)
          }
          set result [wait]
          set output [string map [list $env(APPLE_PASSWORD) "<redacted>"] $output]
          puts $output
          if {[lindex $result 2] != 0 || [lindex $result 3] != 0} {
            exit 1
          }
          if {![regexp -nocase {"status"\s*:\s*"accepted"} $output]} {
            puts stderr "::error::Notarytool did not report an accepted DMG"
            exit 1
          }
          puts "Apple notarization accepted"
          EXPECT
          xcrun stapler staple -v "$DMG_PATH"
          xcrun stapler validate -v "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"


      - name: Collect desktop bundle
        run: |
          mkdir -p staging
          BUNDLE="target/${{ env.TARGET }}/release/bundle"
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} staging/ \;
          find "$BUNDLE/macos" -name '*.app.tar.gz' -exec cp {} staging/ \; || true
          find "$BUNDLE/macos" -name '*.app.tar.gz.sig' -exec cp {} staging/ \; || true
          (cd staging && for f in *.dmg *.app.tar.gz; do
            [ -e "$f" ] && shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done) || true
      # Assemble the updater manifest the app polls at
      # releases/latest/download/latest.json. Only when a signed `.app.tar.gz`
      # exists — forks without the signing key still ship the .dmg + CLI.
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          SIG_FILE="$(ls staging/*.app.tar.gz.sig 2>/dev/null | head -1 || true)"
          if [ -z "$SIG_FILE" ]; then
            echo "No .sig found — skipping latest.json (updater disabled)"
            exit 0
          fi
          APP_TAR="$(ls staging/*.app.tar.gz | head -1)"
          export ASSET="$(basename "$APP_TAR")"
          export VERSION="$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | sed 's/.*: *"\(.*\)".*/\1/')"
          export SIG_FILE
          node -e '
            const fs = require("fs");
            const sig = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            const m = {
              version: process.env.VERSION,
              notes: "oximemo " + process.env.TAG,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: sig,
                  url: "https://github.com/" + process.env.REPO + "/releases/download/" + process.env.TAG + "/" + process.env.ASSET,
                },
              },
            };
            fs.writeFileSync("staging/latest.json", JSON.stringify(m, null, 2) + "\n");
          '
          echo "::group::latest.json"
          cat staging/latest.json
          echo "::endgroup::"

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: staging/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: staging

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          python3 - "${TAG#v}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          section = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          if section is None:
              raise SystemExit("Release version is missing from CHANGELOG.md")
          pathlib.Path("release-notes.md").write_text(section.group(1).strip() + "\n")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" staging/* --clobber
          else
            gh release create "$TAG" \
              --title "oximemo $TAG" \
              --notes-file release-notes.md \
              staging/*
          fi

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      # Publish in dependency topology: core resolves oxi-frontmatter, while
      # session and metadata resolve oximemo-core. Publish both before the CLI.
      # Version comes from cargo metadata for workspace and standalone crates.
      - name: Publish crates (frontmatter, vault-git, core, session, capture, metadata)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in oxi-frontmatter oxi-vault-git oximemo-core oximemo-session oximemo-capture oximemo-metadata; do
            CV=$(cargo metadata --format-version 1 --no-deps | jq -r ".packages[] | select(.name==\"$crate\") | .version")
            echo "Publishing $crate@$CV"
            if curl -fsSL -H "User-Agent: oximemo-release" "https://crates.io/api/v1/crates/$crate" \
                 | grep -q "\"max_stable_version\":\"$CV\""; then
              echo "$crate@$CV already published — skipping"
            else
              cargo publish -p "$crate"
            fi
            # Wait for the sparse index to propagate before the next
            # iteration: oximemo-core resolves oxi-frontmatter from the
            # registry, so publishing it against a not-yet-indexed
            # dependency fails resolution (learned in the v0.10.0 run).
            for i in $(seq 1 30); do
              if curl -fsSL -H "User-Agent: oximemo-release" "https://crates.io/api/v1/crates/$crate" \
                   | grep -q "\"max_stable_version\":\"$CV\""; then
                echo "$crate@$CV indexed"
                break
              fi
              echo "waiting for $crate@$CV to index ($i/30)…"
              sleep 5
            done
          done

      - name: Wait for crates.io to index oximemo-core (cli dependency)
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          for i in $(seq 1 30); do
            if curl -fsSL -H "User-Agent: oximemo-release" "https://crates.io/api/v1/crates/oximemo-core" \
                 | grep -q "\"max_stable_version\":\"$VERSION\""; then
              echo "oximemo-core@$VERSION indexed"
              exit 0
            fi
            echo "waiting for oximemo-core@$VERSION to index ($i/30)…"
            sleep 10
          done
          echo "::error::oximemo-core@$VERSION not indexed in time"
          exit 1

      - name: Publish oximemo-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if curl -fsSL -H "User-Agent: oximemo-release" "https://crates.io/api/v1/crates/oximemo-cli" \
               | grep -q "\"max_stable_version\":\"$VERSION\""; then
            echo "oximemo-cli@$VERSION already published — skipping"
          else
            cargo publish -p oximemo-cli
          fi
