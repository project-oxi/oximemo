name: Release

# Builds the `oximemo` CLI binary and the macOS desktop app (.dmg) for
# aarch64-apple-darwin, then publishes a GitHub Release with the artifacts.
#
# Apple signing + notarization is enabled automatically when the APPLE_*
# secrets are present; otherwise the app is built unsigned (fine for local use).
#
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

env:
  TARGET: aarch64-apple-darwin

jobs:
  build:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # The desktop crate's `generate_context!()` embeds build.frontendDist,
      # so the frontend must be built before `cargo tauri build`.
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      # @tauri-apps/cli is intentionally not a package.json dependency; install
      # the Rust-backed Tauri CLI in the workflow instead.
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build CLI binary
        run: cargo build --release -p oximemo-cli --target ${{ env.TARGET }}

      - name: Package CLI binary
        run: |
          mkdir -p staging
          tar -czf staging/oximemo-${{ env.TARGET }}.tar.gz \
            -C target/${{ env.TARGET }}/release oximemo
          shasum -a 256 staging/oximemo-${{ env.TARGET }}.tar.gz \
            | awk '{print $1}' > staging/oximemo-${{ env.TARGET }}.tar.gz.sha256

      # Stage the CLI binary as a Tauri externalBin sidecar so the .app bundle
      # ships a signed, runnable `oximemo` command (Settings symlinks it onto
      # PATH). Must precede `cargo tauri build`, which embeds + signs it.
      - name: Stage CLI sidecar for app bundle
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ env.TARGET }}/release/oximemo" \
             "apps/desktop/src-tauri/binaries/oximemo-${{ env.TARGET }}"

      # Tauri treats a present-but-empty APPLE_CERTIFICATE as "sign requested"
      # and fails the keychain import, so export the APPLE_* vars to
      # $GITHUB_ENV only when the certificate secret is actually registered.
      # Absent -> fully unsigned build; present -> sign + notarize.
      - name: Export Apple signing env (only when configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Apple signing: enabled"
          else
            echo "Apple signing: disabled (no APPLE_CERTIFICATE) -> unsigned build"
          fi

      # The Tauri updater requires a signed `.app.tar.gz`. Export the signing
      # key when the secret is registered; absent -> unsigned build (updater
      # disabled). Mirrors the APPLE_* gate above.
      - name: Export Tauri updater signing env (only when configured)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Tauri updater signing: enabled"
          else
            echo "Tauri updater signing: disabled (no key) -> unsigned build"
          fi

      - name: Build desktop app (.dmg + .app.tar.gz)
        working-directory: apps/desktop
        run: cargo tauri build --target ${{ env.TARGET }}

      - name: Collect desktop bundle
        run: |
          mkdir -p staging
          BUNDLE="target/${{ env.TARGET }}/release/bundle"
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} staging/ \;
          find "$BUNDLE/macos" -name '*.app.tar.gz' -exec cp {} staging/ \; || true
          find "$BUNDLE/macos" -name '*.app.tar.gz.sig' -exec cp {} staging/ \; || true
          (cd staging && for f in *.dmg; do
            [ -e "$f" ] && shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done) || true

      # Assemble the updater manifest the app polls at
      # releases/latest/download/latest.json. Only when a signed `.app.tar.gz`
      # exists — forks without the signing key still ship the .dmg + CLI.
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          SIG_FILE="$(ls staging/*.app.tar.gz.sig 2>/dev/null | head -1 || true)"
          if [ -z "$SIG_FILE" ]; then
            echo "No .sig found — skipping latest.json (updater disabled)"
            exit 0
          fi
          APP_TAR="$(ls staging/*.app.tar.gz | head -1)"
          export ASSET="$(basename "$APP_TAR")"
          export VERSION="$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | sed 's/.*: *"\(.*\)".*/\1/')"
          export SIG_FILE
          node -e '
            const fs = require("fs");
            const sig = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            const m = {
              version: process.env.VERSION,
              notes: "oximemo " + process.env.TAG,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: sig,
                  url: "https://github.com/" + process.env.REPO + "/releases/download/" + process.env.TAG + "/" + process.env.ASSET,
                },
              },
            };
            fs.writeFileSync("staging/latest.json", JSON.stringify(m, null, 2) + "\n");
          '
          echo "::group::latest.json"
          cat staging/latest.json
          echo "::endgroup::"

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: staging/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: staging

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" staging/* --clobber
          else
            gh release create "$TAG" \
              --title "oximemo $TAG" \
              --generate-notes \
              staging/*
          fi

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      # Leaf crates have no internal dependencies and can publish immediately.
      # oximemo-cli depends on oximemo-core, so core must be indexed first.
      - name: Publish leaf crates (core, capture)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Publishing version $VERSION"
          for crate in oximemo-core oximemo-capture; do
            if curl -fsSL "https://crates.io/api/v1/crates/$crate" \
                 | grep -q "\"max_stable_version\":\"$VERSION\""; then
              echo "$crate@$VERSION already published — skipping"
            else
              cargo publish -p "$crate"
            fi
          done

      - name: Wait for crates.io to index oximemo-core (cli dependency)
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          for i in $(seq 1 30); do
            if curl -fsSL "https://crates.io/api/v1/crates/oximemo-core" \
                 | grep -q "\"max_stable_version\":\"$VERSION\""; then
              echo "oximemo-core@$VERSION indexed"
              exit 0
            fi
            echo "waiting for oximemo-core@$VERSION to index ($i/30)…"
            sleep 10
          done
          echo "::error::oximemo-core@$VERSION not indexed in time"
          exit 1

      - name: Publish oximemo-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if curl -fsSL "https://crates.io/api/v1/crates/oximemo-cli" \
               | grep -q "\"max_stable_version\":\"$VERSION\""; then
            echo "oximemo-cli@$VERSION already published — skipping"
          else
            cargo publish -p oximemo-cli
          fi
