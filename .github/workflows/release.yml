name: Release

# Builds the `oximemo` CLI binary and desktop app artifacts for
# aarch64-apple-darwin (macOS) and x86_64-pc-windows-msvc (Windows), then
# publishes a GitHub Release with one updater manifest covering both.
#
# Official macOS releases require Developer ID signing, notarization, and
# updater signing. Windows builds are not Authenticode-signed yet; their
# NSIS installer still carries the Tauri updater signature. Forks may build
# unsigned artifacts.
#
#   git tag v0.19.0 && git push origin v0.19.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.19.0)'
        required: true

permissions:
  contents: write

env:
  TARGET: aarch64-apple-darwin

jobs:
  build:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          TAURI_VERSION="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          if [[ "$RELEASE_TAG" != "v$VERSION" || "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "::error::tag, Cargo.toml, and tauri.conf.json versions must match (tag=$RELEASE_TAG, cargo=$VERSION, tauri=$TAURI_VERSION)"
            exit 1
          fi
          echo "Validated release tag $RELEASE_TAG at $(git rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The desktop crate's `generate_context!()` embeds build.frontendDist,
      # so the frontend must be built before the Tauri bundle.
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Build CLI binary
        run: cargo build --locked --release -p oximemo-cli --target ${{ env.TARGET }}

      - name: Package CLI binary
        run: |
          mkdir -p staging
          tar -czf staging/oximemo-${{ env.TARGET }}.tar.gz \
            -C target/${{ env.TARGET }}/release oximemo
          shasum -a 256 staging/oximemo-${{ env.TARGET }}.tar.gz \
            | awk '{print $1}' > staging/oximemo-${{ env.TARGET }}.tar.gz.sha256

      # The curl|sh installer ships as a release asset so
      # releases/latest/download/install.sh always matches the binaries
      # it fetches.
      - name: Stage curl installer
        run: cp scripts/install.sh staging/install.sh

      # Stage the CLI binary as a Tauri externalBin sidecar so the .app bundle
      # ships a signed, runnable `oximemo` command (Settings symlinks it onto
      # PATH). Must precede the Tauri build, which embeds + signs it.
      - name: Stage CLI sidecar for app bundle
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          install -m 755 "target/${{ env.TARGET }}/release/oximemo" \
             "apps/desktop/src-tauri/binaries/oximemo-${{ env.TARGET }}"

      # Validate secret availability without writing secret values to
      # GITHUB_ENV or logs. Tauri imports the certificate into a temporary
      # keychain and checks the identity; the resulting app is verified below.
      - name: Validate release signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          }
          if [ "$GITHUB_REPOSITORY" = "project-oxi/oximemo" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              require_secret "$name"
            done
          else
            if [ -n "$APPLE_CERTIFICATE" ]; then
              for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                require_secret "$name"
              done
            fi
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "::error::Missing Tauri updater signing password"
              exit 1
            fi
          fi
          echo "Release signing prerequisites validated"
      - name: Build desktop app (.dmg + .app.tar.gz)
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          # Use the exact @tauri-apps/cli pin installed from bun.lock.
          bun run tauri build --target ${{ env.TARGET }} -- --locked

      - name: Verify app signature and notarize DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ "$GITHUB_REPOSITORY" = "project-oxi/oximemo" ]; then
              echo "::error::Official releases require Apple signing"
              exit 1
            fi
            echo "Skipping signature verification for unsigned fork build"
            exit 0
          fi

          BUNDLE="target/${{ env.TARGET }}/release/bundle"
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$APP" ] || [ -z "$DMG_PATH" ]; then
            echo "::error::Tauri app or DMG bundle is missing"
            exit 1
          fi
          export DMG_PATH

          CLI="$APP/Contents/MacOS/oximemo"
          test -x "$CLI"
          VERSION="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          if [ "$("$CLI" --version)" != "oximemo $VERSION" ]; then
            echo "::error::Bundled CLI version does not match the app"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          AUTHORITY="$(printf '%s\n' "$SIGNATURE" | awk -F= '$1 == "Authority" { print substr($0, index($0, "=") + 1); exit }')"
          TEAM="$(printf '%s\n' "$SIGNATURE" | awk -F= '$1 == "TeamIdentifier" { print $2; exit }')"
          if [ "$AUTHORITY" != "$APPLE_SIGNING_IDENTITY" ] || [ "$TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Built app identity does not match the configured Developer ID"
            exit 1
          fi
          case "$SIGNATURE" in
            *"flags=0x10000(runtime)"*) ;;
            *) echo "::error::App signature lacks hardened runtime"; exit 1 ;;
          esac
          case "$SIGNATURE" in
            *"Timestamp="*) ;;
            *) echo "::error::App signature lacks a secure timestamp"; exit 1 ;;
          esac
          xcrun stapler validate -v "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

          # Python owns a fresh controlling PTY. The macOS system Expect
          # helper can stall before notarytool emits its secure prompt.
          # Password bytes go only through the no-echo PTY, never argv/logs.
          python3 <<'PYTHON'
          import errno, json, os, pty, re, select, signal, termios, time

          password = os.environ["APPLE_PASSWORD"]
          args = ["xcrun", "notarytool", "submit", os.environ["DMG_PATH"],
                  "--apple-id", os.environ["APPLE_ID"],
                  "--team-id", os.environ["APPLE_TEAM_ID"],
                  "--wait", "--output-format", "json"]
          child_env = dict(os.environ)
          child_env.pop("APPLE_PASSWORD", None)
          pid, fd = pty.fork()
          if pid == 0:
              os.execvpe(args[0], args, child_env)

          output = bytearray()
          sent = False
          deadline = time.monotonic() + 120
          exit_status = None
          try:
              attributes = termios.tcgetattr(fd)
              attributes[3] &= ~(termios.ECHO | termios.ECHONL)
              termios.tcsetattr(fd, termios.TCSANOW, attributes)
              while True:
                  ready, _, _ = select.select([fd], [], [], 1)
                  if ready:
                      try:
                          chunk = os.read(fd, 65536)
                      except OSError as error:
                          if error.errno == errno.EIO:
                              break
                          raise
                      if not chunk:
                          break
                      output.extend(chunk)
                      if not sent and re.search(rb"(?i)password[^\r\n]*:", output):
                          os.write(fd, password.encode() + b"\n")
                          sent = True
                  if not sent and time.monotonic() > deadline:
                      raise RuntimeError("Timed out waiting for the secure password prompt")
              _, exit_status = os.waitpid(pid, 0)
          finally:
              os.close(fd)
              if exit_status is None:
                  os.kill(pid, signal.SIGTERM)
                  os.waitpid(pid, 0)

          text = output.decode(errors="replace")
          for field in ("APPLE_PASSWORD", "APPLE_ID", "APPLE_TEAM_ID"):
              text = text.replace(os.environ[field], "<redacted>")
          match = re.search(r"\{[\s\S]*\}\s*$", text)
          if match is None:
              raise RuntimeError("Notarytool did not produce a JSON receipt")
          receipt = json.loads(match.group())
          print(json.dumps({key: receipt.get(key) for key in ("id", "status", "message")}))
          if os.waitstatus_to_exitcode(exit_status) != 0 or receipt.get("status") != "Accepted":
              raise RuntimeError("Apple did not accept the DMG notarization")
          print("Apple notarization accepted")
          PYTHON
          xcrun stapler staple -v "$DMG_PATH"
          xcrun stapler validate -v "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"


      - name: Collect desktop bundle
        run: |
          mkdir -p staging
          BUNDLE="target/${{ env.TARGET }}/release/bundle"
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} staging/ \;
          find "$BUNDLE/macos" -name '*.app.tar.gz' -exec cp {} staging/ \; || true
          find "$BUNDLE/macos" -name '*.app.tar.gz.sig' -exec cp {} staging/ \; || true
          (cd staging && for f in *.dmg *.app.tar.gz; do
            [ -e "$f" ] && shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done) || true
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets-macos
          path: staging/*

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Build CLI binary
        run: cargo build --locked --release -p oximemo-cli --target ${{ env.TARGET }}

      - name: Package CLI binary
        run: |
          set -euo pipefail
          mkdir -p staging
          7z a -tzip "staging/oximemo-${{ env.TARGET }}.zip" "./target/${{ env.TARGET }}/release/oximemo.exe"
          sha256sum "staging/oximemo-${{ env.TARGET }}.zip" \
            | awk '{print $1}' > "staging/oximemo-${{ env.TARGET }}.zip.sha256"

      # Same sidecar contract as macOS: Tauri strips the `-<triple>` suffix
      # and installs `oximemo.exe` next to the app executable.
      - name: Stage CLI sidecar for app bundle
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ env.TARGET }}/release/oximemo.exe" \
             "apps/desktop/src-tauri/binaries/oximemo-${{ env.TARGET }}.exe"

      # tauri.conf.json lists the macOS bundle targets; NSIS is selected
      # here. The updater artifact is the signed `*-setup.exe` itself.
      - name: Build desktop app (NSIS installer)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REPOSITORY" = "project-oxi/oximemo" ]; then
              echo "::error::Missing required secret: TAURI_SIGNING_PRIVATE_KEY"
              exit 1
            fi
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          bun run tauri build --target ${{ env.TARGET }} --bundles nsis -- --locked

      - name: Collect desktop bundle
        run: |
          set -euo pipefail
          BUNDLE="target/${{ env.TARGET }}/release/bundle/nsis"
          SETUP="$(find "$BUNDLE" -maxdepth 1 -name '*-setup.exe' -print -quit)"
          if [ -z "$SETUP" ]; then
            echo "::error::NSIS installer is missing"
            exit 1
          fi
          cp "$SETUP" staging/
          if [ -e "$SETUP.sig" ]; then cp "$SETUP.sig" staging/; fi
          NAME="$(basename "$SETUP")"
          (cd staging && sha256sum "$NAME" | awk '{print $1}' > "$NAME.sha256")

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets-windows
          path: staging/*

  release:
    name: Publish release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: release-assets-*
          path: staging
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Assemble the updater manifest the app polls at
      # releases/latest/download/latest.json. A platform is listed only when
      # its signed updater artifact exists — forks without the signing key
      # still ship the installers + CLI.
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          export VERSION="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("staging");
            const base = "https://github.com/" + process.env.REPO + "/releases/download/" + process.env.TAG + "/";
            const platforms = {};
            for (const [key, re] of [
              ["darwin-aarch64", /\.app\.tar\.gz$/],
              ["windows-x86_64", /-setup\.exe$/],
            ]) {
              const asset = files.find((f) => re.test(f) && files.includes(f + ".sig"));
              if (!asset) continue;
              platforms[key] = {
                signature: fs.readFileSync("staging/" + asset + ".sig", "utf8").trim(),
                url: base + encodeURIComponent(asset),
              };
            }
            if (Object.keys(platforms).length === 0) {
              console.log("No .sig found — skipping latest.json (updater disabled)");
              process.exit(0);
            }
            const m = {
              version: process.env.VERSION,
              notes: "oximemo " + process.env.TAG,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("staging/latest.json", JSON.stringify(m, null, 2) + "\n");
            console.log(JSON.stringify(m, null, 2));
          '

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          python3 - "${TAG#v}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          section = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          if section is None:
              raise SystemExit("Release version is missing from CHANGELOG.md")
          pathlib.Path("release-notes.md").write_text(section.group(1).strip() + "\n")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" staging/* --clobber
          else
            gh release create "$TAG" \
              --title "oximemo $TAG" \
              --notes-file release-notes.md \
              staging/*
          fi

  publish-crates:
    name: Publish to crates.io
    needs: release
    uses: ./.github/workflows/publish-crates.yml
    secrets: inherit
