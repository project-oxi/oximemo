name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # NOTE: scoped to the three headless crates. The desktop crate
      # (apps/desktop/src-tauri) calls `tauri::generate_context!()`, which
      # embeds build.frontendDist at compile time and therefore needs a built
      # `dist/`. It is exercised by the `frontend` job and the release workflow.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p oximemo-core -p oximemo-cli -p oximemo-capture --all-targets -- -D warnings

      - name: test
        run: cargo test -p oximemo-core -p oximemo-cli -p oximemo-capture

  # Validate the desktop crate (apps/desktop/src-tauri) too. The desktop
  # compile embeds the built `dist/` via generate_context!(), so the
  # `frontend` job's build output is reused via upload/download. This catches
  # backend regressions on PRs instead of only at release time.
  desktop-build:
    name: Desktop (clippy + build)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Build frontend (for generate_context! embed)
        run: bun run build

      - name: Tauri config sanity
        run: node -e "const c=require('./src-tauri/tauri.conf.json'); if(!c.bundle) throw new Error('missing bundle section'); if(!c.bundle.macOS.entitlements) throw new Error('missing entitlements');"

      - name: clippy (desktop)
        working-directory: .
        run: cargo clippy -p oximemo-desktop --all-targets -- -D warnings

      - name: check (desktop)
        working-directory: .
        run: cargo check -p oximemo-desktop

  frontend:
    name: Frontend (typecheck + build)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run build
