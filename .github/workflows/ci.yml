name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # NOTE: scoped to headless crates. The desktop crate
      # (apps/desktop/src-tauri) calls `tauri::generate_context!()`, which
      # embeds build.frontendDist at compile time and therefore needs a built
      # `dist/`. It is exercised by the `frontend` job and the release workflow.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --workspace --exclude oximemo-desktop --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace --exclude oximemo-desktop

  # Validate the desktop crate (apps/desktop/src-tauri) too. The desktop
  # compile embeds the built `dist/` via generate_context!(), so the
  # `frontend` job's build output is reused via upload/download. This catches
  # backend regressions on PRs instead of only at release time.
  desktop-build:
    name: Desktop (clippy + build)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: Build frontend (for generate_context! embed)
        run: bun run build

      - name: Tauri config sanity
        run: node -e "const c=require('./src-tauri/tauri.conf.json'); if(!c.bundle) throw new Error('missing bundle section'); if(!c.bundle.macOS.entitlements) throw new Error('missing entitlements');"

      - name: clippy (desktop)
        working-directory: .
        run: cargo clippy --locked -p oximemo-desktop --all-targets -- -D warnings

      - name: check (desktop)
        working-directory: .
        run: cargo check --locked -p oximemo-desktop

      - name: test (desktop)
        working-directory: .
        run: cargo test --locked -p oximemo-desktop

  frontend:
    name: Frontend (typecheck + build)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Preserve PDC fixture bytes on Windows
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bun test src/lib src/stores
      - if: runner.os == 'macOS'
        run: bun run garden:doctor
      - run: bun run build
      - name: Inspect Windows workspace module resolution
        if: failure() && runner.os == 'Windows'
        run: |
          @'
          import ts from "typescript";
          import { resolve } from "node:path";
          import { existsSync, realpathSync } from "node:fs";
          const root = process.cwd();
          const workspace = "vendor/garden/packages/ui";
          const config = ts.readConfigFile("tsconfig.json", ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(config.config, ts.sys, root);
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const moduleName = "@radix-ui/react-dialog";
          for (const directory of [workspace, "node_modules/@garden/ui", "node_modules/.bun/node_modules"]) {
            const file = resolve(directory, "node_modules", moduleName, "package.json");
            console.log(file, existsSync(file) ? realpathSync(file) : "missing");
          }
          for (const source of program.getSourceFiles().filter((file) => file.fileName.endsWith("/GCommandPalette.tsx"))) {
            console.log("source", source.fileName, source.originalFileName, source.path);
            ts.resolveModuleName(moduleName, source.fileName, { ...parsed.options, traceResolution: true }, { ...ts.sys, trace: console.log });
          }
          '@ | node --input-type=module
