name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # NOTE: scoped to the three headless crates. The desktop crate
      # (apps/desktop/src-tauri) calls `tauri::generate_context!()`, which
      # embeds build.frontendDist at compile time and therefore needs a built
      # `dist/`. It is exercised by the `frontend` job and the release workflow.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p oxinot-core -p oxinot-cli -p oxinot-capture --all-targets -- -D warnings

      - name: test
        run: cargo test -p oxinot-core -p oxinot-cli -p oxinot-capture

  frontend:
    name: Frontend (typecheck + build)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run build
