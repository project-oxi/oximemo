name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug!
        Please search existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: "When I run `oximemo list`, … I expected …"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the behavior.
      placeholder: |
        1. Run `oximemo new "…"`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Interface
      options:
        - CLI (`oximemo`)
        - Desktop app
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: oximemo version
      description: Output of `oximemo --version`, or the About version in the desktop app.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.5 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant stderr, `oximemo doctor` output, or console logs. Paste verbatim.
      render: shell
