[package]
name = "oximemo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for oximemo"
repository = "https://github.com/project-oxi/oximemo"
homepage = "https://github.com/project-oxi/oximemo"
readme = "../../README.md"
categories = ["command-line-utilities", "command-line-interface"]
keywords = ["oximemo", "notes", "markdown", "cli", "vault"]
publish = true

[[bin]]
name = "oximemo"
path = "src/main.rs"

[dependencies]
oximemo-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
