[package]
name = "oximemo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for oximemo"
repository = "https://github.com/project-oxi/oximemo"
homepage = "https://github.com/project-oxi/oximemo"
readme = "../../README.md"
categories = ["command-line-utilities", "command-line-interface"]
keywords = ["oximemo", "notes", "markdown", "cli", "vault"]
publish = true

[[bin]]
name = "oximemo"
path = "src/main.rs"

[dependencies]
oximemo-core = { workspace = true }
oximemo-metadata = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }
minisign-verify = "0.2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
