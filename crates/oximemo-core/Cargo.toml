[package]
name = "oximemo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure-Rust core for oximemo: file store, index, search, sync"
repository = "https://github.com/project-oxi/oximemo"
homepage = "https://github.com/project-oxi/oximemo"
readme = "../../README.md"
categories = ["database-implementations", "filesystem"]
keywords = ["oximemo", "notes", "markdown", "vault", "search"]
publish = true

[lib]
name = "oximemo_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
time = { workspace = true }
redb = { workspace = true }
tantivy = { workspace = true }
notify = { workspace = true }
fs2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = "0.1"
regex = "1"
parking_lot = "0.12"
oxi-frontmatter = { version = "0.1", path = "../oxi-frontmatter" }
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["rt"] }

tempfile = "3"
proptest = "1"
tempfile = "3"
