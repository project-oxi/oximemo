[package]
name = "oxinot-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "macOS global Option double-tap monitor for oxinot"

[lib]
name = "oxinot_capture"
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
block2 = "0.5"
thiserror = { workspace = true }

[features]
# Default: stub that returns PermissionDenied so the desktop app falls back
# to the global-shortcut plugin (§6.4). Enable for the real monitor.
default = []
objc2-monitor = []
